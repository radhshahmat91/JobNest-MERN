<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#3157ff" />
  <title>JobNest — Find work that fits you</title>
  <style>
    html,body,#root{margin:0;min-height:100%;width:100%;font-family:Arial,Helvetica,sans-serif}
    body{background:#f7f8fc}
    .boot-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#f8faff,#eef1ff)}
    .boot-card{background:#fff;border:1px solid #e5e8f0;border-radius:24px;padding:34px 42px;box-shadow:0 20px 60px rgba(30,40,80,.12);text-align:center;color:#182033}
    .boot-logo{width:54px;height:54px;border-radius:16px;margin:0 auto 14px;display:grid;place-items:center;background:linear-gradient(135deg,#3157ff,#7857ff);color:#fff;font-size:25px;font-weight:800}
    .boot-card p{color:#667085;margin-bottom:0}
  </style>
</head>
<body>
  <div id="root">
    <div class="boot-screen">
      <div class="boot-card">
        <div class="boot-logo">J</div>
        <h2>JobNest</h2>
        <p>Loading your job marketplace…</p>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
